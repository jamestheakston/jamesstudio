<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog — James Studio</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <meta property="og:image" content="https://jamesstudio.uk/assets/og-image.jpg">
    <meta property="og:image:width" content="1424">
    <meta property="og:image:height" content="752">
    <meta property="og:image:alt" content="James Studio - Minimalist Web Development & Design Agency UK">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #FAF9F6;
            color: #1A1A1A;
        }
        h1, h2, h3, .geometric-font {
            font-family: 'Syne', sans-serif;
            letter-spacing: -0.03em;
        }
        .markdown-body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .markdown-body h1 {
            font-size: 2em;
            font-weight: 600;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eaecef;
            margin-bottom: 16px;
        }
        .markdown-body h2 {
            font-size: 1.5em;
            font-weight: 600;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eaecef;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        .markdown-body p {
            margin-top: 0;
            margin-bottom: 16px;
        }
        .markdown-body code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background-color: rgba(27,31,35,0.05);
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        .markdown-body pre {
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: #f6f8fa;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-body ul {
            padding-left: 2em;
            margin-top: 0;
            margin-bottom: 16px;
        }
        .markdown-body li {
            margin: 0.25em 0;
        }
        .markdown-body a {
            color: #0366d6;
            text-decoration: none;
        }
        .markdown-body a:hover {
            text-decoration: underline;
        }
        .commit-hash {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 12px;
            color: #586069;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #1A1A1A;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-[#FAF9F6]/90 backdrop-blur-md border-b border-[#1A1A1A]/10 px-6 py-4 md:px-12 flex justify-between items-center">
        <a href="/" class="geometric-font text-xl md:text-2xl font-extrabold tracking-tighter flex items-center gap-2">
            JAMES<span class="text-xs bg-[#1A1A1A] text-[#FAF9F6] px-2 py-0.5 rounded-full uppercase tracking-widest">Studio</span>
        </a>
        <a href="/" class="text-sm text-neutral-600 hover:text-black transition-colors">← Back to Home</a>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-12 md:py-20">
        <div class="mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">Changelog</h1>
            <p class="text-neutral-600 text-lg">Recent changes to jamesstudio.uk</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>

        <div id="changelog" class="markdown-body bg-white rounded-2xl border border-[#1A1A1A]/10 p-8 hidden">
            <!-- Changelog content will be loaded here -->
        </div>

        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-2xl p-8 text-center">
            <p class="text-red-600 mb-4">Failed to load changelog from GitHub API.</p>
            <a href="https://github.com/jamestheakston/jamesstudio/commits/main" target="_blank" class="text-red-600 underline">View commits on GitHub</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-[#1A1A1A]/10 py-8 px-6 text-center">
        <p class="text-xs text-neutral-400">
            &copy; <span id="year">2026</span> Pillar Group. Trading as James Studio Web Design UK.
        </p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function fetchChangelog() {
            const loading = document.getElementById('loading');
            const changelog = document.getElementById('changelog');
            const error = document.getElementById('error');

            try {
                const response = await fetch('https://api.github.com/repos/jamestheakston/jamesstudio/commits?per_page=20');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch commits');
                }

                const commits = await response.json();
                
                if (commits.length === 0) {
                    changelog.innerHTML = '<p>No commits found.</p>';
                } else {
                    let html = '';
                    
                    commits.forEach(commit => {
                        const date = new Date(commit.commit.committer.date).toLocaleDateString('en-GB', {
                            day: 'numeric',
                            month: 'long',
                            year: 'numeric'
                        });
                        
                        const message = commit.commit.message.split('\n')[0]; // First line only
                        const shortHash = commit.sha.substring(0, 7);
                        
                        html += `
                            <h2>${date}</h2>
                            <ul>
                                <li>
                                    <strong>${message}</strong>
                                    <br>
                                    <span class="commit-hash">${shortHash}</span>
                                    <a href="${commit.html_url}" target="_blank" class="text-xs ml-2">View on GitHub →</a>
                                </li>
                            </ul>
                        `;
                    });
                    
                    changelog.innerHTML = html;
                }

                loading.classList.add('hidden');
                changelog.classList.remove('hidden');
                
            } catch (err) {
                console.error('Error fetching changelog:', err);
                loading.classList.add('hidden');
                error.classList.remove('hidden');
            }
        }

        // Load changelog on page load
        fetchChangelog();
    </script>
</body>
</html>
