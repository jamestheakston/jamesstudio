<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | James Studio</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <meta property="og:image" content="https://jamesstudio.uk/assets/og-image.jpg">
    <meta property="og:image:width" content="1424">
    <meta property="og:image:height" content="752">
    <meta property="og:image:alt" content="James Studio - Minimalist Web Development & Design Agency UK">
    <!-- Tailwind CSS for high-fidelity styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Syne (geometric, wide header) & Space Grotesk (modern mono-ish clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #FAF9F6;
            color: #1A1A1A;
        }
        h1, h2, .geometric-font {
            font-family: 'Syne', sans-serif;
            letter-spacing: -0.03em;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF9F6;
        }
        ::-webkit-scrollbar-thumb {
            background: #1A1A1A;
            border-radius: 3px;
        }
    </style>
</head>
<body class="antialiased selection:bg-[#1A1A1A] selection:text-[#FAF9F6] min-h-screen flex flex-col">

    <!-- 404 Content -->
    <main class="flex-1 relative overflow-hidden">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2670&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                 alt="Mountain landscape"
                 class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <div class="relative z-10 flex items-center justify-center px-6 md:px-12 py-20 min-h-screen">
            <div class="max-w-4xl text-center space-y-8">
                <!-- Large semi-transparent 404 -->
                <h1 class="text-[12rem] md:text-[16rem] font-extrabold tracking-tight text-white/40 leading-none drop-shadow-2xl">
                    404
                </h1>
                
                <!-- Page Not Found -->
                <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white drop-shadow-lg">
                    PAGE NOT FOUND
                </h2>
                
                <!-- Intelligent Suggestions -->
                <div class="space-y-4 pt-4">
                    <div class="flex items-center justify-center gap-2 text-white/90">
                        <span class="text-xs uppercase font-bold tracking-widest">Suggestions</span>
                        <span class="text-xs">with</span>
                        <span class="text-xs uppercase font-bold tracking-widest">Intelligent Suggestions</span>
                        <a href="/news/intelligent_suggestions" class="text-xs underline hover:text-white">Learn more</a>
                    </div>

                    <div id="suggestions" class="flex flex-col sm:flex-row gap-4 justify-center">
                        <!-- Suggestions will be loaded here by JavaScript -->
                    </div>
                </div>

                <!-- Go Home Button -->
                <div class="pt-8">
                    <a href="/" class="inline-block border-2 border-white text-white px-12 py-4 rounded-full text-sm font-semibold tracking-wider hover:bg-white hover:text-black transition-all drop-shadow-lg">
                        GO HOME
                    </a>
                </div>

                <p class="text-xs text-white/70 pt-8">
                    Photo by <a href="https://unsplash.com/photos/Bkci_8qcdvQ" target="_blank" rel="noopener noreferrer" class="underline hover:text-white">Unsplash</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Available pages on the site
        const availablePages = [
            { path: '/', name: 'Home' },
            { path: '/student', name: 'Student Discount' },
            { path: '/changelog', name: 'Changelog' },
            { path: '/pillargroup', name: 'Pillar Group' },
            { path: '/privacy.html', name: 'Privacy Policy' },
            { path: '/terms.html', name: 'Terms of Service' },
            { path: '/securityalerts.html', name: 'Security Alerts' },
            { path: '/projects/classchartsimprover.html', name: 'ClassCharts Improver' },
            { path: '/projects/scoutscarwash.html', name: 'Scouts Car Wash' },
            { path: '/projects/montecuredogs.html', name: 'Montecure Dogs' },
            { path: '/news/ai-and-our-view', name: 'AI and our POV' },
            { path: '/news/security-and-php', name: 'Security & PHP' },
            { path: '/news/introducing-pillar-group', name: 'Introducing Pillar Group' },
            { path: '/news/intelligent_suggestions', name: 'Intelligent Suggestions' },
            { path: 'https://verify.jamesstudio.uk', name: 'Verify Service', external: true },
            { path: 'mailto:hello@jamesstudio.uk', name: 'Contact for Client Portal', external: true }
        ];

        // Get current path without query parameters
        const currentPath = window.location.pathname;

        // Fallback: Simple keyword matching
        function getFallbackSuggestions() {
            const pathLower = currentPath.toLowerCase();
            
            // Check for keywords in the path
            if (pathLower.includes('student')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('student'));
            }
            if (pathLower.includes('project') || pathLower.includes('work') || pathLower.includes('portfolio')) {
                return availablePages.filter(p => p.path.includes('/projects/'));
            }
            if (pathLower.includes('news') || pathLower.includes('blog') || pathLower.includes('article')) {
                return availablePages.filter(p => p.path.includes('/news/'));
            }
            if (pathLower.includes('privacy')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('privacy'));
            }
            if (pathLower.includes('term')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('term'));
            }
            if (pathLower.includes('security')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('security'));
            }
            if (pathLower.includes('pillar')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('pillar'));
            }
            if (pathLower.includes('change') || pathLower.includes('log')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('changelog'));
            }
            if (pathLower.includes('verify')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('verify'));
            }
            if (pathLower.includes('client')) {
                return availablePages.filter(p => p.name.toLowerCase().includes('client'));
            }
            
            // Default: return Home
            return [availablePages[0]];
        }

        // Use AI to suggest pages
        async function getAISuggestions() {
            const suggestionsDiv = document.getElementById('suggestions');
            
            // Show loading state
            suggestionsDiv.innerHTML = '<span class="text-sm text-white/70">Finding suggestions...</span>';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `The user tried to visit "${currentPath}" but it doesn't exist. 

Main site pages: ${availablePages.filter(p => !p.external).map(p => `${p.name} (${p.path})`).join(', ')}.

Other services: verify.jamesstudio.uk (student verification), client.jamesstudio.uk (client portal - contact hello@jamesstudio.uk).

Analyze the path "${currentPath}" and suggest up to 3 MOST RELEVANT pages from the main site pages list. Only suggest client contact if the path explicitly contains "client". Prioritize actual pages over contact options. Return only the page names, separated by commas.`
                    }),
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Check if AI returned a valid response
                    if (data.response && !data.response.includes('could not generate a response')) {
                        const suggestedNames = data.response.split(',').map(s => s.trim()).filter(s => s);
                        
                        // Match suggested names to pages
                        const suggestions = availablePages.filter(page => 
                            suggestedNames.some(name => 
                                page.name.toLowerCase().includes(name.toLowerCase()) || 
                                name.toLowerCase().includes(page.name.toLowerCase())
                            )
                        ).slice(0, 3);

                        if (suggestions.length > 0) {
                            suggestionsDiv.innerHTML = suggestions.map(page => `
                                <a href="${page.path}" ${page.external ? 'target="_blank" rel="noopener noreferrer"' : ''} class="border border-white/40 text-white px-6 py-3 rounded-full text-sm font-semibold tracking-wider hover:bg-white hover:text-black transition-all drop-shadow-lg">
                                    ${page.name}
                                </a>
                            `).join('');
                            return;
                        }
                    }
                }
                
                // Fallback to algorithmic suggestions if AI fails or returns error
                const fallbackSuggestions = getFallbackSuggestions();
                if (fallbackSuggestions.length > 0) {
                    suggestionsDiv.innerHTML = fallbackSuggestions.map(page => `
                        <a href="${page.path}" ${page.external ? 'target="_blank" rel="noopener noreferrer"' : ''} class="border border-white/40 text-white px-6 py-3 rounded-full text-sm font-semibold tracking-wider hover:bg-white hover:text-black transition-all drop-shadow-lg">
                            ${page.name}
                        </a>
                    `).join('');
                } else {
                    suggestionsDiv.innerHTML = `
                        <a href="/" class="border border-white/40 text-white px-6 py-3 rounded-full text-sm font-semibold tracking-wider hover:bg-white hover:text-black transition-all drop-shadow-lg">
                            Go to Home
                        </a>
                    `;
                }
            } catch (error) {
                console.error('Error getting AI suggestions:', error);
                // Fallback to algorithmic suggestions on error
                const fallbackSuggestions = getFallbackSuggestions();
                if (fallbackSuggestions.length > 0) {
                    suggestionsDiv.innerHTML = fallbackSuggestions.map(page => `
                        <a href="${page.path}" ${page.external ? 'target="_blank" rel="noopener noreferrer"' : ''} class="border border-white/40 text-white px-6 py-3 rounded-full text-sm font-semibold tracking-wider hover:bg-white hover:text-black transition-all drop-shadow-lg">
                            ${page.name}
                        </a>
                    `).join('');
                } else {
                    suggestionsDiv.innerHTML = `
                        <a href="/" class="border border-white/40 text-white px-6 py-3 rounded-full text-sm font-semibold tracking-wider hover:bg-white hover:text-black transition-all drop-shadow-lg">
                            Go to Home
                        </a>
                    `;
                }
            }
        }

        // Call AI suggestions on page load
        getAISuggestions();
    </script>
</body>
</html>
